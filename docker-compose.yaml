services:
  mysql:
    image: mysql:8.0
    ports:
      - 3307:3306
    environment:
      MYSQL_ROOT_PASSWORD: "p4nz3r_punk"
      MYSQL_DATABASE: live
      MYSQL_USER: "massgateadmin"
      MYSQL_PASSWORD: "8fesfsdBOrwe"
    volumes:
      - ./docker/mysql/databasestructure.sql:/docker-entrypoint-initdb.d/databasestructure.sql
      - mysql_data:/var/lib/mysql
    networks:
      massgate_network:
          aliases:
            - readdb.massgate.local
            - writedb.massgate.local

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - 8099:80
    volumes:
      - ./docker/web/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/web/www-root:/usr/share/nginx/html:ro
    networks:
      - massgate_network

  # massgate:
