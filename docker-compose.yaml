services:
  mysql:
    # Connector/C 6.1 (Massgate) is from the MySQL 5.7 era; MySQL 8's
    # default TLS handshake fails with "SSL connection error: unknown error number".
    image: mysql:5.7
    command:
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
      - --skip-ssl
    ports:
      - 3307:3306
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: live
      MYSQL_USER: massgateadmin
      MYSQL_PASSWORD: "${MYSQL_WRITE_PASSWORD}"
      MYSQL_WRITE_PASSWORD: "${MYSQL_WRITE_PASSWORD}"
      MYSQL_READ_PASSWORD: "${MYSQL_READ_PASSWORD}"
    volumes:
      - ./docker/mysql/00-users.sh:/docker-entrypoint-initdb.d/00-users.sh:ro
      - ./docker/mysql/databasestructure.sql:/docker-entrypoint-initdb.d/databasestructure.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      massgate_network:
          aliases:
            - readdb.massgate.local
            - writedb.massgate.local

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - 8099:80
    volumes:
      - ./docker/web/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/web/www-root:/usr/share/nginx/html:ro
    networks:
      - massgate_network

  massgate:
    build:
      target: "${MASSGATE_OS}-runner"
      context: .
      dockerfile: docker/massgate.Dockerfile
    environment:
      MYSQL_WRITE_PASSWORD: "${MYSQL_WRITE_PASSWORD}"
      MYSQL_READ_PASSWORD: "${MYSQL_READ_PASSWORD}"
    ports:
      - 3001:3001
    networks:
      - massgate_network
    depends_on:
      mysql:
        condition: service_healthy
      web:
        condition: service_started

networks:
  massgate_network:
    driver: bridge

volumes:
  mysql_data:
