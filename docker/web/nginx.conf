worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Small text payloads dominate this tree; keep buffers tight.
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;
    client_max_body_size 1m;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    reset_timedout_connection on;

    # Cache open file descriptors — many small .txt files under texts/
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    server_tokens off;
    etag on;
    if_modified_since exact;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    access_log off;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        charset utf-8;
        charset_types text/plain text/css text/xml text/javascript application/javascript application/json;

        # No PHP runtime — serve sources as plain text.
        location ~* \.(php|php__ORIGINAL)$ {
            default_type text/plain;
            try_files $uri =404;

            expires 1h;
            add_header Cache-Control "public, must-revalidate" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location / {
            try_files $uri $uri/ =404;

            # Immutable enough for client patch/news/eula fetches; clients revalidate via ETag.
            expires 1h;
            add_header Cache-Control "public, must-revalidate" always;
            add_header X-Content-Type-Options nosniff always;
        }
    }
}
